services:
  mysql:
    image: mysql:8.0
    container_name: pr_predictor_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: fastapi_demo
      MYSQL_USER: fastapi_user
      MYSQL_PASSWORD: fastapi_password
    ports:
      - "5050:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
